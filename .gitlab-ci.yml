# GitLab pipeline — the same checks as .github/workflows/ci.yml, for whoever
# reviews or hosts the project from GitLab without opening the GitHub repo.
# The deploys — the demo to GitHub Pages, the AI version to Cloudflare,
# the backend to Cloud Run — have no counterpart here; the image jobs instead
# push the two containers to this project's registry, which is what a host pulls.
#
# Keep the two in step by hand: a check added to one belongs in the other. The
# exception is starting the two containers together and checking them over
# HTTP (ci/check-stack.sh), which needs a Docker daemon and so runs on GitHub
# only; see the image jobs below.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch push, unless a merge request for it is open — that pipeline runs
    # instead, rather than both.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    # A tag: a version, whose images are pushed under its name (see the image
    # jobs below).
    - if: $CI_COMMIT_TAG

stages:
  - test
  - images

variables:
  # This instance's runner reuses a build directory between jobs and cleans it
  # with `git clean` first. It could not delete the wheels pip compiled into
  # .cache/pip — while deleting every other file jobs left, root's included.
  # Those wheels are the files pip built in the container's own /tmp and moved
  # in, which fits a host where each container's files carry their own
  # security label (SELinux) and no other container may remove them. The pip
  # cache is no longer kept in the build directory (see .python); this keeps
  # `git clean` away from the ones earlier runs left behind.
  GIT_CLEAN_FLAGS: -ffdx -e .cache/

default:
  interruptible: true

# ── Backend ─────────────────────────────────────────────────────────────────────

.python:
  # The full Debian image, not -slim: theodias needs pypblib, which has no Linux
  # wheel for Python 3.12 and is compiled with g++ (see the Dockerfile).
  image: python:3.12
  variables:
    # A throwaway container: root is all there is, and nothing else shares it.
    PIP_ROOT_USER_ACTION: ignore
  # No pip cache. A cache has to live in the build directory, and the wheels pip
  # compiles there are what the next job's checkout could not delete (see
  # GIT_CLEAN_FLAGS). The price is compiling pypblib each run, about 45s.
  before_script:
    # The image's own pip lags behind, and pip-audit audits the whole
    # environment — so an old pip is reported as though it were a dependency.
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements.txt

backend-tests:
  extends: .python
  stage: test
  timeout: 15m
  script:
    - pytest backend/

# Informational, as on GitHub: most advisories are transitive and not ours to
# fix on the day they appear. Read it when it is red.
backend-audit:
  extends: .python
  stage: test
  timeout: 15m
  allow_failure: true
  script:
    - pip-audit

# ── Frontend ────────────────────────────────────────────────────────────────────

.node:
  image: node:24
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  cache:
    key:
      files: [app/package-lock.json]
    paths: [.cache/npm]
  before_script:
    - cd app
    - npm ci --prefer-offline

frontend-tests:
  extends: .node
  stage: test
  timeout: 15m
  script:
    # Warnings do not fail the build; only rules configured as errors do.
    - npm run lint
    - npm test
    # Blocking: these are the packages that end up in the bundle a visitor
    # downloads.
    - npm audit --omit=dev --audit-level=high

# Informational: the dev toolchain does not ship.
frontend-audit-dev:
  extends: .node
  stage: test
  timeout: 10m
  allow_failure: true
  script:
    - npm audit --audit-level=high

frontend-e2e:
  extends: .node
  stage: test
  # Playwright's own image carries the browsers and their system libraries, so
  # nothing is downloaded at run time. The tag must match @playwright/test in
  # app/package-lock.json exactly; after a bump, a mismatch fails with
  # "Executable doesn't exist", which is the cue to update it here.
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  # Generous next to a green run, but retries: 2 in playwright.config.js mean a
  # genuinely failing suite takes three passes.
  timeout: 25m
  # The backend's dependencies, for the live-backend project: it starts the real
  # FastAPI server with `python3 -m uvicorn` (playwright.config.js). The image is
  # Ubuntu with its own Python 3.12, which pip may not install into (PEP 668), so
  # they go into a virtualenv put first on PATH — that is the `python3` the config
  # then finds. pypblib has no wheel for 3.12 and is compiled: g++, and the
  # headers python:3.12 carries and Ubuntu's Python does not. Capped as the GitHub
  # job caps its apt step: a mirror that stops answering must fail the job, not
  # hang it.
  before_script:
    - timeout 300 apt-get update
    - timeout 300 apt-get install -y --no-install-recommends python3-venv python3-dev g++
    - python3 -m venv /opt/backend
    - export PATH=/opt/backend/bin:$PATH
    - pip install --upgrade pip
    - pip install -r backend/requirements.txt
    - !reference [.node, before_script]
  script:
    - npm run test:e2e
  # The report holds the trace and screenshot of every failure.
  artifacts:
    when: always
    paths: [app/playwright-report/]
    expire_in: 14 days

# ── Containers ──────────────────────────────────────────────────────────────────

# Every pipeline builds the two images and pushes them to this project's
# registry, as $CI_REGISTRY_IMAGE/backend and /frontend, tagged with the commit
# (`3f2a9c1`) and with one name that says where they came from:
#
#   image          a branch or merge request: the branch (`fix-proxy`)
#   image:default  the default branch: `latest`
#   image:release  a Git tag: the version (`v0.2`), from `git tag v0.2`
#
# One job per kind of pipeline, chosen by rules, rather than one job asking the
# shell. Each runs once per image (parallel:matrix). The registry's cleanup
# policy (Settings → Packages and registries) is what keeps branch images from
# piling up.
#
# Buildah rather than Docker: it needs no daemon, so no Docker-in-Docker and no
# privileged runner, which this instance's runners are not (the dind service
# stopped at "mount: permission denied"). chroot isolation and the vfs storage
# driver are what let it run unprivileged; vfs copies each layer whole, which
# is slow and disk-hungry but asks nothing of the kernel. No Compose either:
# it was only building here. Starting the pair and checking it over HTTP is
# the `stack` job in .github/workflows/ci.yml.
#
# Both Dockerfiles name their base images with the registry (docker.io/…),
# which Buildah requires when no registries.conf supplies a default.
#
# Where the frontend is served is decided when it is built, by two CI/CD
# variables (Settings → CI/CD → Variables), so the image in the registry is the
# one the host runs:
#
#   FRONTEND_BASE_PATH            the path it is served from, with a slash at
#                                 each end; unset, the root
#   FRONTEND_PROXY_PROTOCOL_FROM  the address of a proxy speaking PROXY
#                                 protocol to port 8081; unset, nobody
#
# Both are build arguments of app/Dockerfile, which says what they do. The
# backend's Dockerfile declares neither and has no use for them.
.image:
  stage: images
  image: quay.io/buildah/stable:latest
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    # Docker's manifest format, which every host that pulls these understands;
    # it also keeps the HEALTHCHECK, which the OCI format drops.
    BUILDAH_FORMAT: docker
  parallel:
    matrix:
      - NAME: backend
        CONTEXT: .
      - NAME: frontend
        CONTEXT: app
  timeout: 30m
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - ref="$CI_REGISTRY_IMAGE/$NAME"
    - >
      buildah build
      --build-arg BASE_PATH="${FRONTEND_BASE_PATH:-/}"
      --build-arg PROXY_PROTOCOL_FROM="${FRONTEND_PROXY_PROTOCOL_FROM:-127.0.0.1}"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --label org.opencontainers.image.source="$CI_PROJECT_URL"
      --tag "$ref:$CI_COMMIT_SHORT_SHA"
      --tag "$ref:$IMAGE_TAG"
      "$CONTEXT"
    - buildah push "$ref:$CI_COMMIT_SHORT_SHA"
    - buildah push "$ref:$IMAGE_TAG"

image:
  extends: .image
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
    - when: on_success
  variables:
    IMAGE_TAG: $CI_COMMIT_REF_SLUG

image:default:
  extends: .image
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    IMAGE_TAG: latest

image:release:
  extends: .image
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    IMAGE_TAG: $CI_COMMIT_TAG

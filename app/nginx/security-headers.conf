# Headers for the page and its files. Included in each location rather than set
# once on the server, because nginx drops every inherited add_header in a
# location that sets one of its own — and both locations set Cache-Control.
#
# /api is left out: the backend sends these itself (backend/security_headers.py),
# and a second copy of each would reach the browser.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

# The page's own policy arrives as a meta tag written at build time
# (vite-plugins/contentSecurityPolicy.js). frame-ancestors is the one directive a
# meta tag cannot carry, so it is sent here. A browser enforces every policy it
# is given, so this second one can only narrow the first, never loosen it.
add_header Content-Security-Policy "frame-ancestors 'none'" always;

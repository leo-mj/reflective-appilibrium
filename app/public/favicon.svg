<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGradient)"/>

  <!-- Edges (only 45° / 90° angles) -->
  <g stroke="white" stroke-width="12" stroke-linecap="round">
    <!-- R structure (no top-left node) -->
    <line x1="180" y1="260" x2="180" y2="360"/> <!-- vertical spine -->
    <line x1="180" y1="260" x2="270" y2="260"/> <!-- middle bar -->
    <line x1="180" y1="260" x2="270" y2="160"/> <!-- 45° up-right -->
    <line x1="180" y1="260" x2="270" y2="360"/> <!-- 45° down-right -->

    <!-- lowercase "e" loop (angular approximation) -->
    <line x1="270" y1="160" x2="360" y2="160"/> <!-- top -->
    <line x1="360" y1="260" x2="270" y2="260"/> <!-- middle bar -->
    <line x1="360" y1="160" x2="360" y2="260"/> <!-- down -->
    <line x1="270" y1="260" x2="360" y2="360"/> <!-- 45° down-right -->
  </g>

  <!-- Nodes -->
  <g fill="white">
    <!-- R nodes -->
    <circle cx="180" cy="260" r="32"/>
    <circle cx="180" cy="360" r="32"/>

    <!-- Shared / bridge nodes -->
    <circle cx="270" cy="160" r="30"/>
    <circle cx="270" cy="260" r="30"/>
    <circle cx="270" cy="360" r="30"/>

    <!-- e nodes -->
    <circle cx="360" cy="160" r="28"/>
    <circle cx="360" cy="260" r="28"/>
    <circle cx="360" cy="360" r="28"/>
  </g>
</svg>
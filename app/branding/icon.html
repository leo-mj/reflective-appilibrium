<!doctype html>
<!--
  Source for the raster icon fallbacks: public/apple-touch-icon.png (180×180)
  and public/favicon.png (32×32). Safari before 17, plenty of feed readers and
  several link scrapers ignore an SVG icon entirely, so favicon.svg alone leaves
  them with nothing.

  Two variants, chosen by query string, because the nine-node mark turns to mush
  below about 48px — at 32 the strokes land under a pixel wide:

    ?v=full    the mark as public/favicon.svg draws it   → apple-touch-icon.png
    ?v=small   three nodes and two edges, same gradient  → favicon.png

  Rendered by `make icons` from the repo root. Both are rendered at 512 and
  downscaled with sips rather than screenshotted at their final size: Chrome
  refuses to lay out a window much under 500px, so a --window-size=32,32 shot
  crops the corner of a viewport that is really 500 wide. Downscaling also
  antialiases better than rasterising at 32 in the first place.

  The gradient is the favicon's own, so all three icons and the social card
  stay the same object.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Transparent outside the rounded rect: iOS masks the touch icon to its
           own shape, and a white square would show at the corners. */
        background: transparent;
      }
      svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Full: public/favicon.svg, inlined. -->
    <svg
      id="full"
      viewBox="0 0 512 512"
      xmlns="http://www.w3.org/2000/svg"
      hidden
    >
      <defs>
        <linearGradient id="g1" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#2ec4b6" />
          <stop offset="100%" stop-color="#7b2cbf" />
        </linearGradient>
      </defs>
      <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#g1)" />
      <g stroke="white" stroke-width="12" stroke-linecap="round">
        <line x1="180" y1="260" x2="180" y2="360" />
        <line x1="180" y1="260" x2="270" y2="260" />
        <line x1="180" y1="260" x2="270" y2="160" />
        <line x1="180" y1="260" x2="270" y2="360" />
        <line x1="270" y1="160" x2="360" y2="160" />
        <line x1="360" y1="260" x2="270" y2="260" />
        <line x1="360" y1="160" x2="360" y2="260" />
        <line x1="270" y1="260" x2="360" y2="360" />
      </g>
      <g fill="white">
        <circle cx="180" cy="260" r="32" />
        <circle cx="180" cy="360" r="32" />
        <circle cx="270" cy="160" r="30" />
        <circle cx="270" cy="260" r="30" />
        <circle cx="270" cy="360" r="30" />
        <circle cx="360" cy="160" r="28" />
        <circle cx="360" cy="260" r="28" />
        <circle cx="360" cy="360" r="28" />
      </g>
    </svg>

    <!-- Small: the same mark, node for node and edge for edge — only bigger in
         its tile. The glyph sits in the middle 47% of favicon.svg, which at 32px
         leaves it about 15px across with sub-pixel strokes. Scaling it about its
         own centre to fill the tile buys roughly half again the detail without
         redrawing anything, so the two icons stay the same object.

         Glyph bounding box is x 148–388, y 130–392 → centre (268, 261). -->
    <svg
      id="small"
      viewBox="0 0 512 512"
      xmlns="http://www.w3.org/2000/svg"
      hidden
    >
      <defs>
        <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#2ec4b6" />
          <stop offset="100%" stop-color="#7b2cbf" />
        </linearGradient>
      </defs>
      <!-- Less padding than the full tile, for the same reason. -->
      <rect x="12" y="12" width="488" height="488" rx="104" fill="url(#g2)" />
      <g transform="translate(256 256) scale(1.55) translate(-268 -261)">
        <g stroke="white" stroke-width="13" stroke-linecap="round">
          <line x1="180" y1="260" x2="180" y2="360" />
          <line x1="180" y1="260" x2="270" y2="260" />
          <line x1="180" y1="260" x2="270" y2="160" />
          <line x1="180" y1="260" x2="270" y2="360" />
          <line x1="270" y1="160" x2="360" y2="160" />
          <line x1="360" y1="260" x2="270" y2="260" />
          <line x1="360" y1="160" x2="360" y2="260" />
          <line x1="270" y1="260" x2="360" y2="360" />
        </g>
        <g fill="white">
          <circle cx="180" cy="260" r="32" />
          <circle cx="180" cy="360" r="32" />
          <circle cx="270" cy="160" r="30" />
          <circle cx="270" cy="260" r="30" />
          <circle cx="270" cy="360" r="30" />
          <circle cx="360" cy="160" r="28" />
          <circle cx="360" cy="260" r="28" />
          <circle cx="360" cy="360" r="28" />
        </g>
      </g>
    </svg>

    <script>
      const v = new URLSearchParams(location.search).get("v") || "full";
      // removeAttribute, not `.hidden = false`: the hidden IDL property is
      // defined on HTMLElement and these are SVGElements, so the assignment
      // sets a JS property nobody reads and the attribute stays put.
      document.getElementById(v).removeAttribute("hidden");
    </script>
  </body>
</html>

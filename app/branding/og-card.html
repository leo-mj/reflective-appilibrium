<!doctype html>
<!--
  Source for public/og-image.png — the 1200×630 card LinkedIn, Slack and the
  rest show when the site is linked. Not part of the build: nothing imports it
  and it is outside public/, so it never ships. Re-render after editing:

    make og-image        (from the repo root)

  or by hand:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --screenshot=app/public/og-image.png \
      app/branding/og-card.html

  Colours are the app's own tokens (src/constants/colors.js, src/index.css) and
  the mark is public/favicon.svg inlined, so the card and the thing it advertises
  cannot drift apart in palette. The graph is a real fragment of the demo: a
  background theory entailing a principle, and that principle jointly with a
  judgment entailing another judgment.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --dim: #94a3b8;
        --judgment: #2563eb;
        --principle: #7c3aed;
        --theory: #d97706;
        --entails: #16a34a;
        --teal: #2ec4b6;
        --purple: #7b2cbf;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--text);
        display: flex;
        align-items: center;
        position: relative;
      }
      /* The favicon's gradient, spread across the card as a wash rather than a
         block — the node colours have to stay readable on top of it. */
      .wash {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          32deg,
          rgba(46, 196, 182, 0.22) 0%,
          rgba(15, 23, 42, 0) 42%,
          rgba(123, 44, 191, 0.26) 100%
        );
      }
      .edge {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 10px;
        background: linear-gradient(180deg, var(--teal), var(--purple));
      }
      .copy {
        position: relative;
        padding: 0 0 0 82px;
        width: 660px;
        flex-shrink: 0;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 34px;
      }
      .mark svg {
        width: 64px;
        height: 64px;
      }
      .kicker {
        font-size: 19px;
        letter-spacing: 3.4px;
        text-transform: uppercase;
        color: var(--dim);
      }
      h1 {
        font-size: 62px;
        line-height: 1.06;
        letter-spacing: -1.4px;
        font-weight: 700;
      }
      h1 .app {
        background: linear-gradient(96deg, var(--teal), #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin-top: 24px;
        font-size: 26px;
        line-height: 1.5;
        color: var(--dim);
        max-width: 570px;
      }
      .url {
        margin-top: 40px;
        font-size: 21px;
        color: var(--dim);
        opacity: 0.85;
      }
      .art {
        position: relative;
        flex: 1;
        display: flex;
        justify-content: center;
      }
      .label {
        font-size: 21px;
        font-weight: 700;
        fill: #fff;
      }
      .caption {
        font-size: 17px;
        fill: var(--dim);
        font-weight: 600;
        letter-spacing: 0.4px;
      }
    </style>
  </head>
  <body>
    <div class="wash"></div>
    <div class="edge"></div>

    <div class="copy">
      <div class="mark">
        <!-- public/favicon.svg, inlined -->
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bgGradient" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#2ec4b6" />
              <stop offset="100%" stop-color="#7b2cbf" />
            </linearGradient>
          </defs>
          <rect
            x="32"
            y="32"
            width="448"
            height="448"
            rx="96"
            fill="url(#bgGradient)"
          />
          <g stroke="white" stroke-width="12" stroke-linecap="round">
            <line x1="180" y1="260" x2="180" y2="360" />
            <line x1="180" y1="260" x2="270" y2="260" />
            <line x1="180" y1="260" x2="270" y2="160" />
            <line x1="180" y1="260" x2="270" y2="360" />
            <line x1="270" y1="160" x2="360" y2="160" />
            <line x1="360" y1="260" x2="270" y2="260" />
            <line x1="360" y1="160" x2="360" y2="260" />
            <line x1="270" y1="260" x2="360" y2="360" />
          </g>
          <g fill="white">
            <circle cx="180" cy="260" r="32" />
            <circle cx="180" cy="360" r="32" />
            <circle cx="270" cy="160" r="30" />
            <circle cx="270" cy="260" r="30" />
            <circle cx="270" cy="360" r="30" />
            <circle cx="360" cy="160" r="28" />
            <circle cx="360" cy="260" r="28" />
            <circle cx="360" cy="360" r="28" />
          </g>
        </svg>
        <span class="kicker">Ethics · Reflective equilibrium</span>
      </div>

      <h1>Reflective <span class="app">APPilibrium</span></h1>
      <p>
        Map moral judgments, principles and the arguments between them, and
        revise until your position hangs together.
      </p>
      <div class="url">leo-mj.github.io/reflective-appilibrium</div>
    </div>

    <div class="art">
      <svg width="470" height="512" viewBox="0 0 470 512">
        <defs>
          <marker
            id="head"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="5.5"
            markerHeight="5.5"
            orient="auto-start-reverse"
          >
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
          </marker>
        </defs>

        <g stroke="#16a34a" stroke-width="4" fill="none" stroke-linecap="round">
          <!-- T1 → P2: a background theory arguing for a principle. -->
          <path d="M 96 344 L 96 288" marker-end="url(#head)" />
          <!-- J1 and P2 converge on a dot, and continue as one arrow to J5:
               neither premise gets you there alone. -->
          <path d="M 138 116 L 214 186" />
          <path d="M 160 240 L 214 200" />
          <path d="M 232 193 L 316 193" marker-end="url(#head)" />
        </g>
        <circle cx="222" cy="193" r="9" fill="#16a34a" />

        <!-- Judgment: a circle. -->
        <circle
          cx="96"
          cy="90"
          r="46"
          fill="#2563eb"
          stroke="#0f172a"
          stroke-width="3"
        />
        <text x="96" y="98" text-anchor="middle" class="label">J1</text>

        <!-- Principle: a rounded rectangle. -->
        <rect
          x="20"
          y="206"
          width="152"
          height="82"
          rx="41"
          fill="#7c3aed"
          stroke="#0f172a"
          stroke-width="3"
        />
        <text x="96" y="255" text-anchor="middle" class="label">P2</text>

        <!-- Background theory: a diamond. -->
        <rect
          x="46"
          y="344"
          width="100"
          height="100"
          rx="12"
          transform="rotate(45 96 394)"
          fill="#d97706"
          stroke="#0f172a"
          stroke-width="3"
        />
        <text x="96" y="402" text-anchor="middle" class="label">T1</text>

        <!-- The conclusion. -->
        <circle
          cx="372"
          cy="193"
          r="52"
          fill="#2563eb"
          stroke="#0f172a"
          stroke-width="3"
        />
        <text x="372" y="201" text-anchor="middle" class="label">J5</text>

        <text x="235" y="500" text-anchor="middle" class="caption">
          judgments · principles · background theories
        </text>
      </svg>
    </div>
  </body>
</html>

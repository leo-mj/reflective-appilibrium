name: CI

on:
  push:
    # `deploy` is the release branch: every push to it publishes the demo to
    # GitHub Pages and the version with the AI features to Cloudflare.
    branches: [main, visualisation, deploy]
  pull_request:
    branches: [main]
  # Deploying the backend is a deliberate act, never a side effect of a push:
  # it replaces the server people are using. See the deploy-backend job.
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Every job carries a cap. The default is six hours, which is not a timeout
    # so much as a licence for a wedged download to burn the whole budget.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # pip first: pip-audit audits the whole environment, so the runner's own
      # older pip would be reported as though it were one of ours.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/

      # Informational. Most advisories that land here are transitive and not
      # ours to fix on the day they appear, so this reports without blocking an
      # unrelated PR. Read it when it is red; do not ignore it forever.
      - name: Audit Python dependencies
        run: pip-audit
        continue-on-error: true

  # The image is deployed by hand, so this is the only place a broken Dockerfile
  # shows up before a deploy does. It starts the container as well as building
  # it: the likeliest failures — a dependency left out by the allowlist in
  # .dockerignore, an unwritable working directory for rethon.log — build fine
  # and only fail at import.
  backend-image:
    name: Backend image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t appilibrium-backend .

      - name: Start and check health
        run: |
          docker run -d --name backend -p 8000:8000 \
            -e CORS_ORIGINS=https://example.org appilibrium-backend
          for _ in $(seq 30); do
            if body=$(curl -fsS http://127.0.0.1:8000/api/health); then
              echo "$body"
              # The image must start in the hosted posture unless told otherwise.
              echo "$body" | grep -q '"deployment":"hosted"'
              # And hosted means no public schema.
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)" = 404
              exit 0
            fi
            sleep 2
          done
          echo "::error::The container did not answer /api/health within a minute."
          exit 1

      # Whatever failed — build, startup, or one of the checks — the container's
      # own output is what says why.
      - name: Container logs
        if: failure()
        run: docker logs backend || true

  # The single-host setup from docker-compose.yml: nginx serving the page and
  # forwarding /api to the backend. Checked over HTTP rather than trusted,
  # because each thing it promises fails silently — a wrong base path is a blank
  # page, a missing fallback is a 404 on reload, a policy naming the wrong
  # backend refuses every request.
  stack:
    name: Frontend image and single-host stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build and start
        run: docker compose up -d --build

      # The same script .gitlab-ci.yml runs, so the two pipelines check one thing.
      - name: Check the page and the proxy
        run: ci/check-stack.sh http://127.0.0.1:8080

      - name: Container logs
        if: failure()
        run: docker compose logs

  test:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Warnings do not fail the build; only rules configured as errors do.
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Blocking, because these are the packages that end up in the bundle a
      # visitor downloads.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # Informational: the dev toolchain (vite, postcss, undici) does not ship,
      # and its advisories are mostly dev-server issues. Worth seeing, not worth
      # blocking a PR that did not cause them.
      - name: Audit dev dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: Frontend end-to-end tests
    runs-on: ubuntu-latest
    # Generous next to a green run of a few minutes, but the retries: 2 in
    # playwright.config.js mean a genuinely failing suite takes three passes.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # For the live-backend project, which starts the real FastAPI server and
      # runs the SPA against it — the one test where the two meet rather than
      # each meeting a fake of the other. See playwright.config.js.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../backend/requirements.txt

      # Keyed on the lockfile, so a Playwright bump re-downloads and every other
      # run reuses the binary.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('app/package-lock.json') }}

      # This is the apt half of what used to be `install --with-deps`. The
      # ubuntu-latest image already ships the shared libraries headless chromium
      # needs, so it is belt-and-braces — but it shells out to apt, and an apt
      # mirror that accepted the connection and then stopped answering once hung
      # this job for six hours, until the default job timeout killed it. Hence
      # the hard cap and the swallowed failure: a sulking mirror must not block a
      # run the image can already satisfy. If chromium ever fails to launch with
      # a missing-library error, this is the step to look at first.
      - name: Install Playwright system dependencies
        run: |
          timeout 300 npx playwright install-deps chromium \
            || echo "::warning::playwright install-deps failed or timed out; relying on the runner image's preinstalled libraries"

      # Only chromium: the mobile project pins browserName to chromium too, so
      # nothing here needs firefox or webkit.
      - name: Install Playwright browser
        run: npx playwright install chromium
        timeout-minutes: 5

      - name: Run end-to-end tests
        run: npm run test:e2e

      # The HTML report carries the trace and screenshot for every failure,
      # which is the difference between "e2e went red" and knowing why.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    # backend-image too: the site and the image are released from the same commit,
    # so a site should not go out on a commit whose backend image does not start.
    needs: [test, test-backend, backend-image, e2e]
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: app

    steps:
      # Full history, so main is there to compare against below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `deploy` is a release point on main, and trailing main is its normal state
      # — so this does not ask whether it is up to date. It asks whether every
      # commit about to be published is on main, which catches a fix or experiment
      # committed straight to `deploy`: code that would go public never having been
      # merged, and would be silently lost from the site at the next release.
      - name: Check every commit being published is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::deploy has commits that are not on main. Merge them into main, then reset deploy to a commit on main."
            git log --oneline origin/main..HEAD
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The demo: no backend, no LLM, no key in the tab, so it is safe on a
      # shared github.io host. The version that holds a visitor's key goes to
      # an address of its own — the deploy-cloudflare job below.
      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The version with the AI features, to Cloudflare as a Worker serving static
  # assets. Same trigger, gates and main-ancestry check as the demo: both sites
  # are released from one commit.
  #
  # Cloudflare rather than GitHub Pages because this build holds a visitor's API
  # key in the tab. Its own address keeps that key off a shared github.io origin,
  # and Cloudflare serves the _headers file the CSP plugin writes, so
  # frame-ancestors and the rest of the policy arrive as real response headers —
  # a <meta> tag cannot carry them.
  #
  # A Worker rather than a Cloudflare Pages project: Cloudflare labels Pages
  # "legacy" and puts new features into Workers only, so a new site on Pages is
  # a migration scheduled for later. An assets-only Worker has no code and no
  # wrangler config file; everything it needs is on the command line below.
  #
  # Built here and uploaded with wrangler, rather than by Cloudflare's own Git
  # integration, which would build every push whether or not the tests passed.
  #
  # The backend is deployed separately (deploy-backend, manually). This reads
  # its address from VITE_BACKEND_URL, which is stable across backend deploys.
  # Deploy the backend first: a site pointed at a backend that does not answer
  # yet is just a broken site.
  #
  # One-off setup, all in the browser — the first deploy creates the Worker:
  #   1. Cloudflare, My Profile → API Tokens: a token with the single permission
  #      Account → Workers Scripts → Edit. Note the account ID (Workers & Pages
  #      overview).
  #   2. Choose the Worker's name. The site is then at
  #      https://<name>.<subdomain>.workers.dev, <subdomain> being the account's
  #      workers.dev subdomain (Workers & Pages → Settings). Changing the name
  #      means a new Worker, and the address goes into the backend's CORS.
  #   3. GitHub, Settings → Secrets and variables → Actions:
  #        secret    CLOUDFLARE_API_TOKEN     the token
  #        secret    CLOUDFLARE_ACCOUNT_ID    the account ID
  #        variable  CLOUDFLARE_WORKER_NAME   <name>
  #        variable  VITE_BACKEND_URL         the URL the deploy-backend run printed
  #   4. Set BACKEND_CORS_ORIGINS to https://<name>.<subdomain>.workers.dev (plus
  #      any custom domain) and run deploy-backend again.
  # `wrangler dev --assets=dist` serves a build as this Worker will.
  deploy-cloudflare:
    name: Deploy to Cloudflare
    needs: [test, test-backend, backend-image, e2e]
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same check as the demo's; see the deploy job above.
      - name: Check every commit being published is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::deploy has commits that are not on main. Merge them into main, then reset deploy to a commit on main."
            git log --oneline origin/main..HEAD
            exit 1
          fi

      # Said before anything is built, naming what is missing. VITE_BACKEND_URL
      # is checked for https:// because app/.env.backend carries a placeholder,
      # and a build that fell back to it would publish a site whose every
      # request fails. It is a variable rather than a secret: it ends up in the
      # bundle in plain text either way.
      - name: Check the deployment is configured
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          WORKER: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=
          case "$VITE_BACKEND_URL" in https://*) ;; *) missing="$missing VITE_BACKEND_URL(https://)" ;; esac
          [ -n "$WORKER" ] || missing="$missing CLOUDFLARE_WORKER_NAME"
          [ "$HAS_TOKEN" = true ] || missing="$missing CLOUDFLARE_API_TOKEN(secret)"
          [ "$HAS_ACCOUNT" = true ] || missing="$missing CLOUDFLARE_ACCOUNT_ID(secret)"
          if [ -n "$missing" ]; then
            echo "::error::Set these in Settings → Secrets and variables → Actions, see the comment above the deploy-cloudflare job in ci.yml:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Environment variables win over the placeholder in app/.env.backend.
      # The build writes dist/_headers beside index.html (contentSecurityPolicy.js).
      - name: Build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_BASE_PATH: /
        run: |
          npm run build:backend
          test -f dist/_headers

      # The first run creates the Worker; later runs replace what it serves.
      # Wrangler 4 is what _headers was checked with (`wrangler dev --assets`
      # serves the CSP as a header), rather than whatever the action defaults to.
      # The compatibility date is pinned so a deploy never changes the runtime's
      # behaviour by itself; with no Worker code of its own, it barely matters.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: app
          command: >-
            deploy
            --assets=dist
            --name=${{ vars.CLOUDFLARE_WORKER_NAME }}
            --compatibility-date=2026-06-01

  # The backend, to Cloud Run. Manual only: this replaces the server people are
  # using, and a push should never do that on its own. Run it from the Actions
  # tab ("Run workflow") on the branch you want deployed.
  #
  # Authentication is Workload Identity Federation — GitHub proves which repo
  # and workflow is asking, and Google trusts that directly. No service-account
  # key is stored in the repository; there is no long-lived credential to leak.
  #
  # Cloud Run because its free tier (180,000 vCPU-seconds, 360,000 GiB-seconds
  # and 2M requests a month, counted only while serving) covers a research tool
  # with room to spare. The price is a few seconds' cold start after an idle
  # spell, since the service scales to zero.
  #
  # One-off setup, once per Google Cloud project:
  #
  #   PROJECT=your-project-id
  #   REGION=europe-west3
  #   REPO=appilibrium
  #   GITHUB_REPO=leo-mj/reflective-appilibrium
  #
  #   gcloud config set project "$PROJECT"
  #   gcloud services enable run.googleapis.com artifactregistry.googleapis.com \
  #       iamcredentials.googleapis.com
  #
  #   # Where the image lives. The cleanup policy keeps storage inside the free
  #   # half-gigabyte: without it every deploy leaves an image behind for good.
  #   gcloud artifacts repositories create "$REPO" --repository-format=docker --location="$REGION"
  #   cat > /tmp/cleanup.json <<'JSON'
  #   [{"name": "keep-3", "action": {"type": "Keep"}, "mostRecentVersions": {"keepCount": 3}},
  #    {"name": "drop-the-rest", "action": {"type": "Delete"}, "condition": {"olderThan": "7d"}}]
  #   JSON
  #   gcloud artifacts repositories set-cleanup-policies "$REPO" --location="$REGION" \
  #       --policy=/tmp/cleanup.json
  #
  #   # The identity this job acts as.
  #   gcloud iam service-accounts create github-deploy
  #   SA="github-deploy@$PROJECT.iam.gserviceaccount.com"
  #   for role in roles/run.admin roles/artifactregistry.writer roles/iam.serviceAccountUser; do
  #     gcloud projects add-iam-policy-binding "$PROJECT" --member="serviceAccount:$SA" --role="$role"
  #   done
  #
  #   # Workload Identity Federation. The attribute condition is what stops any
  #   # other repository using this.
  #   gcloud iam workload-identity-pools create github --location=global
  #   gcloud iam workload-identity-pools providers create-oidc github \
  #       --location=global --workload-identity-pool=github \
  #       --issuer-uri="https://token.actions.githubusercontent.com" \
  #       --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" \
  #       --attribute-condition="assertion.repository=='$GITHUB_REPO'"
  #   NUMBER=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
  #   gcloud iam service-accounts add-iam-policy-binding "$SA" \
  #       --role=roles/iam.workloadIdentityUser \
  #       --member="principalSet://iam.googleapis.com/projects/$NUMBER/locations/global/workloadIdentityPools/github/attribute.repository/$GITHUB_REPO"
  #   echo "GCP_WORKLOAD_IDENTITY_PROVIDER=projects/$NUMBER/locations/global/workloadIdentityPools/github/providers/github"
  #
  # Then these repository variables (Settings → Secrets and variables → Actions
  # → Variables). None is secret: the workflow holds no credential.
  #   GCP_PROJECT_ID                  the project id
  #   GCP_REGION                      e.g. europe-west3
  #   GCP_ARTIFACT_REPO               appilibrium
  #   GCP_WORKLOAD_IDENTITY_PROVIDER  printed by the last command above
  #   GCP_DEPLOY_SERVICE_ACCOUNT      github-deploy@<project>.iam.gserviceaccount.com
  #   BACKEND_CORS_ORIGINS            the frontend's origin, scheme://host with no
  #                                   path — the deploy-cloudflare Worker's address
  #
  # And set a budget alert (Billing → Budgets & alerts) at an amount you would
  # notice, say €1: the free tier covers normal use, and the alert is what says
  # when that stops being true.
  #
  # The run's summary prints the service URL, which is the VITE_BACKEND_URL the
  # deploy-cloudflare job needs.
  deploy-backend:
    name: Deploy backend to Cloud Run
    if: github.event_name == 'workflow_dispatch'
    # The same gates as any other change, plus the image actually starting.
    needs: [test-backend, backend-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Lets the job mint the OIDC token Google checks. Without it the auth
      # step fails with "unable to get ACTIONS_ID_TOKEN_REQUEST_URL".
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Said before anything is built, naming what is missing: the alternative
      # is gcloud failing several minutes later on an empty flag.
      - name: Check the deployment is configured
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPO: ${{ vars.GCP_ARTIFACT_REPO }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          ORIGINS: ${{ vars.BACKEND_CORS_ORIGINS }}
        run: |
          missing=
          for name in PROJECT REGION REPO PROVIDER ACCOUNT ORIGINS; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these repository variables (Settings → Secrets and variables → Actions → Variables), see the comment above the deploy-backend job in ci.yml:$missing"
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Built here rather than by Cloud Build: the runner already has Docker,
      # and this way nothing but the finished image reaches Google.
      - name: Build and push the image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/backend
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          # Tagged with the commit as well as `latest`, so a rollback names the
          # commit it goes back to.
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Deploy
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/backend
        run: |
          # --max-instances=1 is required, not tuning: the rate limiter counts
          #   in one process's memory, so a second instance doubles every
          #   allowance (backend/.env.example, "Overrides").
          # --min-instances=0 is what keeps this inside the free tier; the
          #   price is a few seconds' cold start after an idle spell.
          # TRUSTED_PROXY_HOPS=1: Cloud Run's front end appends the caller's
          #   address to x-forwarded-for, and that entry is the one to believe.
          # The ^##^ prefix makes ## the separator, so CORS_ORIGINS may list
          #   several comma-separated origins.
          gcloud run deploy appilibrium-backend \
            --image "$IMAGE:$GITHUB_SHA" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 40 \
            --timeout 300 \
            --set-env-vars "^##^DEPLOYMENT=hosted##TRUSTED_PROXY_HOPS=1##CORS_ORIGINS=${{ vars.BACKEND_CORS_ORIGINS }}"

      - name: Check it answers
        run: |
          url=$(gcloud run services describe appilibrium-backend \
            --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
          # The first request wakes the container and imports rethon, so allow
          # for a slow one rather than failing a deploy that is merely starting.
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 --max-time 60 "$url/api/health" -o health.json
          cat health.json
          grep -q '"deployment":"hosted"' health.json
          echo "VITE_BACKEND_URL for the frontend build: $url" >> "$GITHUB_STEP_SUMMARY"

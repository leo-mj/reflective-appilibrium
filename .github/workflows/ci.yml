name: CI

on:
  push:
    branches: [main, visualisation, deploy]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/

      # Informational. Most advisories that land here are transitive and not
      # ours to fix on the day they appear, so this reports without blocking an
      # unrelated PR. Read it when it is red; do not ignore it forever.
      - name: Audit Python dependencies
        run: pip-audit
        continue-on-error: true

  test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Warnings do not fail the build; only rules configured as errors do.
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Blocking, because these are the packages that end up in the bundle a
      # visitor downloads.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      # Informational: the dev toolchain (vite, postcss, undici) does not ship,
      # and its advisories are mostly dev-server issues. Worth seeing, not worth
      # blocking a PR that did not cause them.
      - name: Audit dev dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    name: Frontend end-to-end tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only chromium: the mobile project pins browserName to chromium too, so
      # nothing here needs firefox or webkit. --with-deps pulls the system
      # libraries the headless browser needs on a bare runner.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      # The HTML report carries the trace and screenshot for every failure,
      # which is the difference between "e2e went red" and knowing why.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, test-backend, e2e]
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
